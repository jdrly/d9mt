# Checks every pull request and every push to main on GitHub's hosted runners: the workflow
# lints clean, the bridge and the driver (x64 and x86) build from scratch, and every test that
# needs no GPU passes, the two Wine console tests included. docs/testing.md § CI lists which
# scripts run here and which can't. No secrets and read-only access (the run's own token is
# used once, to download a public release asset).
#
# It also runs every night on main, so a changed runner image shows up as a red run of an
# unchanged commit, and by hand on any branch (Actions -> Checks -> Run workflow, or
# `gh workflow run checks.yml --ref <branch>`). The nightly run adds the steps that are too slow
# for every push; a run by hand adds them with `-f full=true`.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Also run the nightly-only steps (test-build-deps.sh with BUILD=1).
        type: boolean
        default: false

permissions:
  contents: read

# A pull request keeps one run per branch: a new push cancels the older run. Every other run
# has a group of its own (the event and the commit), so a push to main never cancels the run of
# the commit before it, and each commit on main ends with a verdict.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No shellcheck over scripts/ yet: the tree has 17 warnings under `shellcheck -S warning`
      # (0.11.0, 2026-11-12). actionlint runs shellcheck on the run blocks below.
      - name: actionlint
        run: |
          v=1.7.12
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "$sha  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c --quiet
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  build:
    # GitHub has no macos-27 label; its macOS 27 image with Xcode 27 is xcode-27, a public
    # preview (actions/runner-images#14404; .github/actionlint.yaml lists it). The AIR byte
    # checks compare d9mt's output with what Apple's toolchain writes for macOS 26 and 27, and
    # test-air-cache-lineage.sh expects a macOS 27 host, so macos-26 (Xcode 26) can't run them.
    runs-on: xcode-27
    # About 25 minutes with LLVM in the cache, about 50 when it has to build LLVM first.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # winemetal.so, the LLVM tools and one native test are x86_64 and run under Rosetta. The
      # scripts need bash >= 4.3 (/bin/bash is 3.2) and mingw-w64 for the PE side.
      - name: Tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          arch -x86_64 /usr/bin/true || softwareupdate --install-rosetta --agree-to-license
          brew install bash mingw-w64
          brew_bin="$(brew --prefix)/bin"
          "$brew_bin/bash" -c '(( BASH_VERSINFO[0] > 4 || (BASH_VERSINFO[0] == 4 && BASH_VERSINFO[1] >= 3) ))'
          echo "$brew_bin" >> "$GITHUB_PATH"
          sw_vers
          xcodebuild -version
          echo "Xcodes on this image:" /Applications/Xcode*.app
          echo "SDK $(xcrun -sdk macosx --show-sdk-version), $(uname -m), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) >> 30 )) GB"
          "$brew_bin/bash" --version | head -1
          x86_64-w64-mingw32-g++ --version | head -1
          clang --version | head -1
          python3 --version

      # Xcode 26 and later ship the Metal toolchain as a separate download. The AIR byte checks
      # need it, and build-driver.sh needs it when a shader source changed.
      - name: Metal toolchain
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      # The bridge links static LLVM 15.0.7 libraries for x86_64, built by
      # scripts/build-llvm-unixside.sh. The cache holds the installed libraries and llvm-dis (the
      # AIR byte checks read bitcode with it). The key names the recipe, so a changed recipe
      # builds again. Bump v1 when the steps below change what goes into the cache.
      - name: LLVM 15.0.7 from the cache
        id: llvm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchains/llvm-x86_64
            toolchains/llvm-build/bin/llvm-dis
          key: llvm-15.0.7-x86_64-xcode-27-v1-${{ hashFiles('scripts/build-llvm-unixside.sh') }}

      # The recipe clones the tag llvmorg-15.0.7 unless toolchains/llvm-project exists. Check out
      # the tag's commit by its hash first, so a moved tag can't change what gets built.
      - name: Build LLVM 15.0.7 (cache miss)
        if: steps.llvm.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          git init -q toolchains/llvm-project
          git -C toolchains/llvm-project fetch -q --depth 1 https://github.com/llvm/llvm-project \
            8dfdcc7b7bf66834a761bd8de445840ef68e4d1a
          git -C toolchains/llvm-project -c advice.detachedHead=false checkout -q FETCH_HEAD
          scripts/build-llvm-unixside.sh
          ninja -C toolchains/llvm-build llvm-dis

      # Saved right after the build, before any other script of the checkout runs.
      - name: Save LLVM 15.0.7 to the cache
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            toolchains/llvm-x86_64
            toolchains/llvm-build/bin/llvm-dis
          key: ${{ steps.llvm.outputs.cache-primary-key }}

      - name: Fetch dxbc-spirv
        run: scripts/fetch-deps.sh

      # SMOKE=0: the bridge's smoke test needs a Metal GPU and reference metallibs from
      # build-air-compiler.sh. The runner has 3 CPUs and 7 GB, so 4 compiles at once.
      # The step runs under the runner's own locale, en_US.UTF-8, whose collation sorts the
      # codegen files differently from byte order. build-bridge.sh lists them in byte order
      # itself; the digest step below fails if it doesn't.
      - name: Build the bridge
        env:
          SMOKE: 0
          D9MT_JOBS: 4
        run: |
          echo "LANG=${LANG-unset} LC_ALL=${LC_ALL-unset} LC_COLLATE=${LC_COLLATE-unset}"
          scripts/build-bridge.sh

      # The id digests d9mt's codegen objects and the LLVM libraries, both built on this runner.
      - name: AIR codegen id
        run: |
          {
            echo "### AIR codegen id of this run"
            echo
            echo "Built on this runner, with its own LLVM build. A release build of this commit records the same id as long as its compiler generates the same code. No step compares it with a recorded release id."
            echo
            echo '```'
            cat build/bridge/air-codegen-id.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # What the id is made of, file by file: the normalized digest scripts/air-codegen-id.py gives
      # each object and each LLVM archive of build-bridge.sh's CODEGEN_OBJS. Two builds with
      # different ids differ in the files whose lines differ. The list below repeats CODEGEN_OBJS
      # in byte order (LC_ALL=C for the globs). The step fails when its id isn't the build's:
      # then build-bridge.sh listed the files in another order (the locale's, before it sorted
      # them itself), or CODEGEN_OBJS changed and the list here has to follow.
      - name: AIR codegen digests
        env:
          LC_ALL: C
        run: |
          shopt -s nullglob
          obj=build/bridge/obj
          airlib=build/airlib/obj
          files=(
            "$obj/airlib_unix_renamed.o" "$obj/air_cache.c.o" "$obj/cache.c.o"
            "$airlib"/third_party_dxbc-spirv_ir_*.o
            "$airlib"/third_party_dxbc-spirv_util_*.o
            "$airlib/air_air_builder.cpp.o" "$airlib/air_air_metallib.cpp.o"
            toolchains/llvm-x86_64/lib/libLLVM*.a
          )
          {
            echo "LANG=${LANG-unset} LC_ALL=${LC_ALL-unset} LC_COLLATE=${LC_COLLATE-unset}"
            python3 -I .github/codegen-digests.py "${files[@]}"
          } > "$RUNNER_TEMP/codegen-digests.txt" || { cat "$RUNNER_TEMP/codegen-digests.txt"; exit 1; }
          {
            echo "<details><summary>AIR codegen digests, file by file</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/codegen-digests.txt"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          tail -2 "$RUNNER_TEMP/codegen-digests.txt"

      - name: Keep the AIR codegen digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codegen-digests
          path: ${{ runner.temp }}/codegen-digests.txt
          retention-days: 30

      # The AIR corpus through the driver's compile path (airlib_loopback) for AIR targets 26 and
      # 27, for the metallib-load job, which loads them on a real macOS 26. Here, on macOS 27,
      # both targets must load and compile: that shows the loader works where it should.
      - name: AIR corpus metallibs
        run: |
          out="$RUNNER_TEMP/air-metallibs"
          for os in 26 27; do
            mkdir -p "$out/t$os"
            for bin in air/tests/bin/*.bin; do
              if ! env -u D9MT_AIR_LEGACY "D9MT_AIR_MACOS=$os" build/airlib/airlib_loopback build/airlib/d9mtair.so \
                     "$bin" "$out/t$os/$(basename "$bin" .bin).metallib" > "$RUNNER_TEMP/loopback.txt" 2>&1; then
                echo "::error::airlib_loopback failed on $bin for AIR target $os"
                cat "$RUNNER_TEMP/loopback.txt"
                exit 1
              fi
            done
          done
          .github/metallib-load.sh "$out" 26=loads 27=loads

      - name: Keep the AIR corpus metallibs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: air-metallibs
          path: ${{ runner.temp }}/air-metallibs
          retention-days: 7

      # build-driver.sh keeps a committed metallib header whose sources changed when it lacks the
      # tools to regenerate it, and only warns. Here that fails, and so does a regenerated header:
      # a pull request that changes a shader source commits the new header.
      - name: Build the driver (x64)
        env:
          ARCH: x64
          D9MT_JOBS: 4
        run: |
          scripts/build-driver.sh 2>&1 | tee "$RUNNER_TEMP/driver-x64.log"
          if grep 'keeping existing' "$RUNNER_TEMP/driver-x64.log"; then
            echo "::error::a committed metallib header is older than its shader sources"
            exit 1
          fi

      - name: Build the driver (x86)
        env:
          ARCH: x86
          D9MT_JOBS: 4
        run: scripts/build-driver.sh

      - name: The builds leave tracked files as committed
        run: git diff --exit-code

      # run-native-tests.sh names a failed test's log file and doesn't print it; the step after
      # it does, so a failure can be read in the run.
      - name: Native tests
        run: scripts/run-native-tests.sh 2>&1 | tee "$RUNNER_TEMP/native-tests.txt"

      - name: Logs of the native tests that failed
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/native-tests.txt" ] || exit 0
          sed -n 's/^[A-Za-z0-9_]*: FAIL (\(.*\))$/\1/p' "$RUNNER_TEMP/native-tests.txt" | sed 's/^build, //' |
            while IFS= read -r log; do
              echo "::group::$log"
              tail -n 100 "$log" || true
              echo "::endgroup::"
            done

      # test-state-cache.sh, test-pso-key-hash.sh and test-residency.sh compile driver sources
      # against DXVK's native Windows headers: v3.0.2 (driver/UPSTREAM), with the directx
      # submodule at the commit that tree pins.
      - name: DXVK's native headers
        run: |
          git init -q "$RUNNER_TEMP/dxvk"
          git -C "$RUNNER_TEMP/dxvk" fetch -q --depth 1 https://github.com/doitsujin/dxvk \
            6b20f622a77b87b2921fe5d2c1774d2f2ba3e9b7
          git -C "$RUNNER_TEMP/dxvk" -c advice.detachedHead=false checkout -q FETCH_HEAD
          git -C "$RUNNER_TEMP/dxvk" submodule update -q --init --depth 1 include/native/directx
          echo "DXVK_NATIVE=$RUNNER_TEMP/dxvk/include/native" >> "$GITHUB_ENV"

      # Every test script that needs no Wine and no GPU. All of them run, also after a failure;
      # the step fails if any did.
      - name: Test scripts
        run: |
          tests=(
            scripts/test-air-versions.sh
            scripts/test-air-forms.sh
            scripts/test-air-invariance.sh
            scripts/test-air-cache-lineage.sh
            scripts/test-build-deps.sh
            scripts/test-fetch-deps.sh
            scripts/test-null-kind.sh
            scripts/test-pass-barrier.sh
            scripts/test-present-ring.sh
            scripts/test-pso-key-hash.sh
            scripts/test-residency.sh
            scripts/test-state-cache.sh
            scripts/test-upload-copy.sh
            scripts/test-perf-compare.py
            scripts/test-cmp-hash-runs.py
          )
          {
            echo "### Test scripts"
            echo
            echo "| Script | Result | Seconds |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for t in "${tests[@]}"; do
            start=$SECONDS
            echo "::group::$t"
            rc=0
            case "$t" in
              *.py) python3 -I "$t" || rc=$? ;;
              *) "$t" || rc=$? ;;
            esac
            echo "::endgroup::"
            if [ "$rc" = 0 ]; then result=ok; else result="FAILED (exit $rc)"; failed=$((failed + 1)); fi
            echo "$t: $result, $((SECONDS - start)) s"
            echo "| \`$t\` | $result | $((SECONDS - start)) |" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$failed" = 0 ]

      # The Wine engine the app installs (swtor-on-mac src/som.sh: ENGINE_URL, ENGINE_SHA256): an
      # x86_64 Wine that runs under Rosetta and needs no library path. Downloaded on every run,
      # not cached, as an asset of the release cx-26.3.0-8 of the public jdrly/wine-engine.
      # gh fetches it with this run's read-only token: an anonymous download from a shared runner
      # is the first thing GitHub throttles, and one answered with HTTP 500 on main (run
      # 43196575934). Three tries, 20 s apart; each failure prints gh's error with its HTTP
      # status. The SHA-256 check comes after the loop and decides alone whether the file is
      # the engine: a retry can fetch the file again, it can't make another file pass.
      - name: Wine engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=cx-26.3.0-8
          file=wine-cx-26.3.0-8-macos-x86_64.tar.xz
          sha=1976c3310a1f8be2f8e9a46fcb524f77b4316df3d281d94af2c8542bef60456d
          got=0
          for try in 1 2 3; do
            if gh release download "$tag" --repo jdrly/wine-engine --pattern "$file" \
                 --output "$RUNNER_TEMP/engine.tar.xz" --clobber; then
              got=1
              break
            fi
            echo "::warning::the engine download failed, try $try of 3 (gh's error is the line above)"
            [ "$try" = 3 ] || sleep 20
          done
          if [ "$got" != 1 ]; then
            echo "::error::no engine after 3 tries: GitHub didn't deliver the release asset. This says nothing about the commit."
            exit 1
          fi
          echo "$sha  $RUNNER_TEMP/engine.tar.xz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/engine"
          tar -xJf "$RUNNER_TEMP/engine.tar.xz" -C "$RUNNER_TEMP/engine" --strip-components 1 wine
          rm "$RUNNER_TEMP/engine.tar.xz"
          echo "WINE_ENGINE=$RUNNER_TEMP/engine" >> "$GITHUB_ENV"

      # The two test scripts that need Wine and nothing else: console programs, no window and no
      # GPU. test-fatal-log.sh makes the prefix (wineboot, then ShowCrashDialog=0) and
      # test-cs-sync.sh runs in it; it needs the x64 driver build's libdriver_core.a. Both run,
      # also after a failure; the step fails if either did. The time limit is for a Wine process
      # that never ends: it fails the step.
      - name: Wine test scripts
        timeout-minutes: 15
        env:
          WINEDLLOVERRIDES: mscoree,mshtml=
        run: |
          work="$RUNNER_TEMP/wine-tests"
          failed=0
          for t in test-fatal-log.sh test-cs-sync.sh; do
            start=$SECONDS
            echo "::group::scripts/$t"
            rc=0
            case "$t" in
              test-fatal-log.sh)
                ENGINE="$WINE_ENGINE" WORK="$work" scripts/test-fatal-log.sh || rc=$? ;;
              test-cs-sync.sh)
                WINEPREFIX="$work/prefix" WINEDEBUG=-all WINEMSYNC=1 WINE="$WINE_ENGINE/bin/wine" \
                  scripts/test-cs-sync.sh || rc=$?
                WINEPREFIX="$work/prefix" "$WINE_ENGINE/bin/wineserver" -k || true ;;
            esac
            echo "::endgroup::"
            if [ "$rc" = 0 ]; then result=ok; else result="FAILED (exit $rc)"; failed=$((failed + 1)); fi
            echo "scripts/$t: $result, $((SECONDS - start)) s"
            echo "- \`scripts/$t\` (Wine): $result, $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$failed" = 0 ]

      # The hash suite can't draw here (no Metal 4), but everything before the first frame can
      # run: every test program builds with the hash harness, the crash guard builds, and the
      # runner makes its prefix and checks that no crash dialog can open in it. The drawing
      # itself runs on a Mac with a real GPU (docs/testing.md § Hash suite).
      - name: Hash suite, up to the first frame
        timeout-minutes: 15
        env:
          WORK: ${{ runner.temp }}/hash-suite
        run: ENGINE="$WINE_ENGINE" scripts/run-hash-tests.sh --build-only

      # The script compares this tree's build scripts with main's, so it needs main's tip.
      - name: test-build-jobs.sh
        run: |
          git fetch -q --no-tags --depth 1 origin +main:refs/remotes/origin/main
          scripts/test-build-jobs.sh

      # Its cases depend on the caller's environment. On my Mac 2 failed in one job environment
      # and none in another. On a hosted runner 5 fail. Two are the "two callers" cases (native
      # and wine): the caller's OLDPWD or SHLVL reaches the run. Three are the RUN_WRAPPER cases
      # with `nice -n 3`: the runner's shell runs at nice -10, so the runs show nice -10 without
      # the wrapper and -7 with it, and the test expects 0 and 3. The wrapper works there; the
      # expectation doesn't. Not blocking until the test stops depending on its caller.
      - name: test-perf-abba.sh (not blocking)
        continue-on-error: true
        run: |
          if scripts/test-perf-abba.sh; then
            echo "- \`scripts/test-perf-abba.sh\`: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- \`scripts/test-perf-abba.sh\`: FAILED (not blocking, depends on the caller's environment)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Part 2 of test-build-deps.sh: five x64 driver builds, two of them from scratch (a no-op
      # build compiles nothing, a changed flag rebuilds every object). Too slow for every push.
      # It runs last because it rebuilds build/driver-x64.
      - name: test-build-deps.sh with real builds (nightly)
        if: github.event_name == 'schedule' || inputs.full
        env:
          BUILD: 1
          D9MT_JOBS: 4
        run: scripts/test-build-deps.sh

  # d9mt's AIR metallibs on a real macOS 26. macOS 26 accepts AIR 2.8 at most: a metallib tagged
  # 2.9 gave every macOS 26 player a black screen (2026-10-28, #110). The build job compiles the
  # AIR corpus for targets 26 and 27; this job loads both with macOS 26's Metal through the
  # classic API and builds render pipelines from them (.github/metallib-load.sh and .m). Target 26
  # must load and compile. Target 27 is the control: macOS 26 must reject it at
  # newLibraryWithData, or this job couldn't tell a wrong target from a right one.
  # The device is the Apple Paravirtual device. A pass says macOS 26's Metal takes the
  # container and the AIR; it says nothing about an Apple GPU's compiler back end or Metal 4.
  metallib-load:
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: air-metallibs
          path: ${{ runner.temp }}/air-metallibs

      - name: Load the AIR corpus with macOS 26's Metal
        run: .github/metallib-load.sh "$RUNNER_TEMP/air-metallibs" 26=loads 27=rejects

  # What a hosted runner's Metal device can do, in the job summary. No check depends on it: it
  # says whether the tests that need a GPU (and later the hash suite under Wine) could run here.
  # A part of the probe that crashes is reported with its exit status and doesn't fail the job.
  metal-probe:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-26, xcode-27]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Probe
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          clang -Wall -O1 -framework Foundation -framework Metal .github/metal-probe.m -o "$RUNNER_TEMP/metal-probe"
          {
            echo "### Metal probe on $IMAGE"
            echo
            echo '```'
            echo "macOS $(sw_vers -productVersion) ($(sw_vers -buildVersion)), $(xcodebuild -version | tr '\n' ' ')"
            echo "SDK $(xcrun -sdk macosx --show-sdk-version), $(uname -m), $(sysctl -n hw.model), $(sysctl -n hw.ncpu) CPUs, $(( $(sysctl -n hw.memsize) >> 30 )) GB"
            for part in device metal4 textures; do
              rc=0
              "$RUNNER_TEMP/metal-probe" "$part" 2>&1 || rc=$?
              [ "$rc" = 0 ] || echo "$part: the probe ended with exit status $rc"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
