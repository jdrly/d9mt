name: Task
description: A planned change, written as a precise specification (developers and agents)
title: ""
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Write the title as `Context: Actionable result`, for example
        `Present path: Keep the drawable until the GPU has retired it`, and use **the same title for the pull request**
        (see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#issues)). The area is a label, not a
        title prefix. Use the terms from [CONTEXT.md](../blob/main/CONTEXT.md).

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What should happen and why, and where the request came from.
      placeholder: |
        Where it came from (a player's report, a measurement, a review, an upstream change), what
        problem it solves and what happens if it isn't done. Link the evidence.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Affected areas
      description: >-
        Files, functions, scripts, settings or pages this touches. **List only what you have
        verified in the repository**: a wrong path costs whoever picks this up more time than
        an empty field.
    validations:
      required: false

  - type: textarea
    id: changes
    attributes:
      label: What's needed
      description: A numbered list of concrete changes.
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Technical, observable conditions for done. The developer checks them.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: uat
    attributes:
      label: Verification (UAT)
      description: >-
        Not the same as the acceptance criteria. **UAT is a scenario a non-technical player can
        click through** and answer yes or no at the end. Each step is an action and, after the
        arrow, the expected result. No commands, no reading logs.
        d9mt has no window of its own: write the scenario in a game (for example SWTOR
        through a SWTOR on Mac development build), or with a test program from `test/` when no game
        shows it.
      value: |
        **Game and how it runs:** (for example SWTOR on SWTOR on Mac 0.1.4-dev.1)
        **Mac, chip and macOS:**
        **Scene and settings:** (where in the game, vsync, Retina)

        1. Action.
           → Expected result.
        2.
           →
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Implementation notes
      description: Constraints, traps, what to watch out for, what deliberately not to do.
    validations:
      required: false

  - type: checkboxes
    id: contract
    attributes:
      label: Contract check
      options:
        - label: >-
            The terms used match `CONTEXT.md`, or adding them to the glossary is part of this task.
          required: false
        - label: >-
            The task contradicts no `accepted` ADR, or the conflict is described and a new ADR is
            part of the task.
          required: false
